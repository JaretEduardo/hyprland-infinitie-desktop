# managed by hyprland-infinitie-desktop (install.sh power)
#
# Single owner per power event — see docs/POWER.md for the full matrix. This
# file only pins the events logind itself must own; hypridle/hyprlock own
# everything else (idle timers, locking, DPMS, suspend-by-inactivity).
#
#   HandleLidSwitch                lid closed, not docked, one display
#                                   -> suspend
#   HandleLidSwitchDocked          lid closed AND (docked OR more than one
#                                   display connected) -> ignore, i.e. keep
#                                   running on the external monitor. logind
#                                   determines "docked" itself from dock/DRM
#                                   state; nothing here or in Hyprland
#                                   duplicates that check.
#   HandleLidSwitchExternalPower   suspend, same as HandleLidSwitch. logind
#                                   checks HandleLidSwitchDocked (dock / >1
#                                   display) FIRST, regardless of AC state, so
#                                   that check still wins on external power
#                                   too — this directive only decides the
#                                   no-external-display, on-AC case, which
#                                   must suspend just like on battery.
#                                   logind.conf(5): "if the system is on
#                                   external power the action (if any)
#                                   specified by HandleLidSwitchExternalPower=
#                                   occurs; otherwise the HandleLidSwitch=
#                                   action occurs" — i.e. ExternalPower takes
#                                   priority over plain HandleLidSwitch
#                                   whenever it names an action, so leaving it
#                                   at "ignore" (an earlier version of this
#                                   file did) makes lid-close on AC do
#                                   nothing instead of falling back to
#                                   HandleLidSwitch=suspend. Set to "suspend"
#                                   explicitly so it agrees with
#                                   HandleLidSwitch instead of overriding it.
#   HandlePowerKey                 lock — never an accidental poweroff from
#                                   one stray press.
#   IdleAction                     ignore: hypridle (ext-idle-notify-v1), not
#                                   logind's own session-idle detection, owns
#                                   the idle -> dim -> lock -> dpms -> suspend
#                                   ladder.
#
# These are systemd's own documented defaults for HandleLidSwitch,
# HandleLidSwitchDocked and IdleAction — written out explicitly, rather than
# left implicit, so a future systemd/distro default change can't silently
# change this laptop's behaviour.
#
# Takes effect on the next `systemctl restart systemd-logind` (can briefly
# disturb active sessions) or at the next login/reboot. install.sh power
# never restarts systemd-logind for you.

[Login]
HandleLidSwitch=suspend
HandleLidSwitchDocked=ignore
HandleLidSwitchExternalPower=suspend
HandlePowerKey=lock
IdleAction=ignore
