# generated by hypr-wallpaper (wallust) — machine-local, git-ignored.
# Imported by ~/.config/fuzzel/fuzzel.ini via `include=`. fuzzel colours are
# RRGGBBAA hex with no leading '#'.
[colors]
background={{ background | darken(0.10) | strip }}f2
text={{ foreground | strip }}ff
prompt={{ color5 | saturate(0.20) | strip }}ff
input={{ foreground | strip }}ff
placeholder={{ foreground | darken(0.35) | strip }}ff
match={{ color5 | saturate(0.20) | strip }}ff
selection={{ background | lighten(0.18) | strip }}ff
selection-text={{ foreground | strip }}ff
selection-match={{ color5 | saturate(0.20) | strip }}ff
border={{ color5 | saturate(0.20) | strip }}ff
