# hyprland-portals.conf — which xdg-desktop-portal backend answers each request
# for the Hyprland session. xdg-desktop-portal reads this file because
# XDG_CURRENT_DESKTOP=Hyprland (set in config/hypr/lua/env.lua).
#
#   default = hyprland;gtk
#     For any interface: try the Hyprland backend first
#     (xdg-desktop-portal-hyprland — ScreenCast / Screenshot / GlobalShortcuts),
#     then fall back to the GTK backend (xdg-desktop-portal-gtk).
#   FileChooser / Settings = gtk
#     xdph does not implement these; pin them to GTK explicitly so there is no
#     ambiguity (file "Open"/"Save" dialogs, the light/dark preference).
#
# See docs/SESSION.md "Desktop portals".

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
