# generated by hypr-wallpaper (wallust) — machine-local, git-ignored.
# Sourced by ~/.config/hypr/hyprlock.conf, which defines the same variables
# as fallbacks before the `source =` line.
$lock_bg     = rgba({{ background | darken(0.10) | strip }}ff)
$lock_fg     = rgba({{ foreground | strip }}ff)
$lock_fg_dim = rgba({{ foreground | darken(0.25) | strip }}ff)
$lock_inner  = rgba({{ background | lighten(0.10) | strip }}e6)
$lock_outer  = rgba({{ color5 | saturate(0.20) | strip }}ff)
