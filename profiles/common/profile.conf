# profiles/common/profile.conf — defaults for every machine this repo targets.
#
# No match.* fields here on purpose: this is the fallback profile, applied
# whenever no more specific profile's match.* fields agree with the real
# machine (lib/profile.sh profile::detect, ./install.sh profile). Hardware
# expectations are deliberately absent too — common makes no hardware claims
# to validate; that is what a specific profile (profiles/<id>/) is for.
#
# Plain "key=value" data only — never sourced/executed as shell. See
# docs/PROFILES.md for the full field reference.

id=common
name=Common workstation defaults

init=systemd
network_backend=NetworkManager
audio_stack=pipewire-wireplumber
compositor=hyprland
shell=quickshell
primary_gpu_preference=amd
nvidia_role=on-demand
