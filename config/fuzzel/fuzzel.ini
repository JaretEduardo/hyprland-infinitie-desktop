# fuzzel — application launcher for this desktop (Super+Space).
# man 5 fuzzel.ini.  Colours are RRGGBBAA hex, no leading '#'.
#
# Colours are wallpaper-driven and live entirely in the imported file:
# `hypr-wallpaper` (wallust) regenerates ~/.config/fuzzel/colors.local.ini
# from config/wallust/templates/fuzzel-colors.local.ini. It is seeded with a
# sane fallback by `hypr-wallpaper --seed`, which lua/autostart.lua runs once
# per fresh session — so the file is always present before Super+Space is
# usable. (If it were ever missing, fuzzel falls back to its own defaults and
# still launches.) The import brings its own [colors] section scope.
include=~/.config/fuzzel/colors.local.ini

[main]
font=sans-serif:size=12
prompt="  "
icons-enabled=no
terminal=foot
lines=12
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=8

[border]
width=2
radius=6
