# fuzzel — application launcher for this desktop (Super+Space).
# man 5 fuzzel.ini.  Palette matches the Quickshell bar and mako
# (Tokyo Night): #1a1b26 background, #c0caf5 text, #7aa2f7 accent,
# #2a2e3f selection. One small file — no theme framework.
# Colours are RRGGBBAA hex, no leading '#'.

[main]
font=sans-serif:size=12
prompt="  "
icons-enabled=no
terminal=foot
lines=12
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=8

[colors]
background=1a1b26f5
text=c0caf5ff
prompt=7aa2f7ff
input=c0caf5ff
placeholder=8a92b2ff
match=7aa2f7ff
selection=2a2e3fff
selection-text=c0caf5ff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=6
