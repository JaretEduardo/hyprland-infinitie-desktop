# hyprlock.conf — clean and functional; the visuals can evolve later.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/ (current widget syntax,
# checked during this project's stage-20 research)
#
# Only launched by hypridle's lock_cmd (config/hypridle/hypridle.conf) — it
# never runs on its own and is not autostarted by Hyprland.
#
# No general{} or auth{} block: every default already matches what's wanted
# here (PAM auth enabled, cursor visible, no fractional-scaling override).
# No monitor is named anywhere below — an empty `monitor =` applies to all of
# them, so this works the same whether the laptop panel is alone or an
# external monitor is attached.

background {
    monitor =
    color = rgba(21, 22, 30, 1.0)
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 64
    color = rgba(220, 223, 240, 1.0)
    halign = center
    valign = center
    position = 0, 120
}

# Basic lock state: who is locked out, and the last failed attempt if any.
label {
    monitor =
    text = $USER  $ATTEMPTS[]
    font_size = 16
    color = rgba(180, 184, 210, 1.0)
    halign = center
    valign = center
    position = 0, 40
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    inner_color = rgba(30, 32, 44, 0.9)
    outer_color = rgba(90, 95, 130, 1.0)
    font_color = rgba(220, 223, 240, 1.0)
    fade_on_empty = true
    placeholder_text = <i>Enter password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 12
    halign = center
    valign = center
    position = 0, -80
}
