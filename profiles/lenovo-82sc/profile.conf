# profiles/lenovo-82sc/profile.conf — this Lenovo IdeaPad Gaming 3 16ARH7.
#
# match.* fields are the ONLY thing lib/profile.sh (./install.sh profile)
# uses to decide this profile applies: real DMI data under
# /sys/class/dmi/id/*, never the hostname. Every match.* field present must
# agree (AND) for this profile to be selected.
#
# expect.* fields are hardware EXPECTATIONS, checked read-only by
# `profile::validate` (./install.sh profile / doctor / first-run) against
# lib/hardware.sh. A mismatch is reported as a warning, never fatal — real
# hardware and BIOS/PCI enumeration can legitimately vary or change.
#
# note.* fields are informational only and are NEVER applied automatically.
# In particular note.internal_resolution below is not an override: the real
# monitor mode is always resolved for real by ./install.sh monitor /
# first-run against the live Hyprland session — never hardcoded here.
#
# Plain "key=value" data only — never sourced/executed as shell. See
# docs/PROFILES.md for the full field reference.

id=lenovo-82sc
name=Lenovo IdeaPad Gaming 3 16ARH7 (82SC)

match.sys_vendor=LENOVO
match.product_name=82SC

laptop=1
hybrid_gpu=1
primary_gpu=amd
secondary_gpu=nvidia
nvidia_role=on-demand
internal_panel_role=edp

expect.cpu_vendor=AuthenticAMD
expect.igpu_pci=1002:1681
expect.igpu_desc=AMD Radeon 680M
expect.dgpu_pci=10de:25a0
expect.dgpu_desc=NVIDIA RTX 3050 Ti Mobile
expect.wifi_pci=14c3:7961
expect.wifi_desc=MediaTek MT7921 (Filogic 330)
expect.eth_pci=10ec:8168
expect.eth_desc=Realtek RTL8111/8168
expect.battery=1
expect.backlight=1

note.internal_resolution=1920x1200 (informational only; real mode is resolved by install.sh monitor / first-run, never an override)
note.internal_refresh=real max refresh pending first-run/Hyprland confirmation on this hardware
