# managed by hyprland-infinitie-desktop (install.sh gpu)
#
# NVIDIA DRM kernel mode setting. Required for the proprietary driver to work
# properly under Wayland (Hyprland). Since NVIDIA driver 570.86.16, fbdev
# follows modeset automatically, so only modeset is set here.
#
# Verify after a reboot:  cat /sys/module/nvidia_drm/parameters/modeset  -> Y
#
# NOT set here, on purpose (modern driver + Gentoo x11-drivers/nvidia-drivers
# handle these; forcing them can be wrong):
#
#   NVreg_DynamicPowerManagement
#       The driver auto-selects the best RTD3 level on supported laptops
#       (observed value 3 on driver 610 with no config). Only add
#       `options nvidia NVreg_DynamicPowerManagement=0x02` if, after boot,
#       `grep DynamicPowerManagement /proc/driver/nvidia/params` reports 0.
#
#   NVreg_PreserveVideoMemoryAllocations
#       Default on recent drivers (observed value 2). The nvidia-suspend /
#       nvidia-resume / nvidia-hibernate systemd services rely on it and are
#       installed + preset-enabled by the driver package.
#
#   Early KMS (nvidia modules in the initramfs)
#       Deliberately not done: it can break resume-from-hibernate and needs a
#       manual initramfs rebuild. See docs/HYBRID-GPU.md.

options nvidia_drm modeset=1
