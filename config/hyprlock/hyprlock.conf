# hyprlock.conf — the lock screen, styled toward the @gentoolarp rice intro:
# the current wallpaper heavily blurred, a time-of-day greeting, the username
# large, the date (and optional weather) to one side, an optional now-playing
# card at the bottom, and a clean password field. Lots of breathing room.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/  (widget syntax)
#
# Launched only by hypridle's lock_cmd (config/hypridle/hypridle.conf) — never
# autostarted. No monitor is named anywhere, so an empty `monitor =` covers the
# laptop panel alone or with an external display attached.
#
# THEME is wallpaper-driven. The $lock_* colour vars below are the fallback;
# the first `source =` pulls in ~/.config/hypr/hyprlock-colors.local.conf
# (regenerated by `hypr-wallpaper` from config/wallust/templates/, seeded by
# `hypr-wallpaper --seed`). The second `source =` pulls in $lock_image — the
# path to the current still wallpaper, or a cached frame of the current video
# wallpaper (hyprlock never plays video itself). A missing source file just
# leaves the fallback in place.

$lock_bg     = rgba(2f2430ff)
$lock_fg     = rgba(f1e2ecff)
$lock_fg_dim = rgba(c2aab8ff)
$lock_inner  = rgba(3a2c37e6)
$lock_outer  = rgba(e6c4d8ff)
$lock_image  = screenshot

source = ~/.config/hypr/hyprlock-colors.local.conf
source = ~/.config/hypr/hyprlock-image.local.conf

$font = sans-serif

general {
    hide_cursor = true
    ignore_empty_input = true
}

# ---- background: current wallpaper, heavily blurred + tinted -------------
background {
    monitor =
    path = $lock_image
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.17
    vibrancy_darkness = 0.2
}

# a soft wash of the theme background over the blur, for consistent contrast
# whatever the wallpaper
background {
    monitor =
    color = rgba(1a1420cc)
    path =
}

# ---- centre: greeting + username --------------------------------------
label {
    monitor =
    text = cmd[] hypr-greeting
    font_family = $font
    font_size = 28
    color = $lock_fg_dim
    halign = center
    valign = center
    position = 0, 96
}

label {
    monitor =
    text = cmd[] whoami
    font_family = $font
    font_size = 64
    color = $lock_fg
    halign = center
    valign = center
    position = 0, 34
}

# ---- password field --------------------------------------------------
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    rounding = 14
    inner_color = $lock_inner
    outer_color = $lock_outer
    check_color = $lock_outer
    fail_color = rgba(e6a6b0ff)
    font_color = $lock_fg
    fade_on_empty = true
    placeholder_text = <i>Enter password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    halign = center
    valign = center
    position = 0, -64
}

# ---- top-left: date, then optional weather --------------------------
label {
    monitor =
    text = cmd[update:60000] date +"%A"
    font_family = $font
    font_size = 22
    color = $lock_fg
    halign = left
    valign = top
    position = 56, -52
}
label {
    monitor =
    text = cmd[update:60000] date +"%d %B %Y"
    font_family = $font
    font_size = 14
    color = $lock_fg_dim
    halign = left
    valign = top
    position = 56, -88
}

# weather — empty (and invisible) unless ~/.config/hypr/weather.conf exists
# (see scripts/desktop/hypr-weather; it makes one opt-in request to wttr.in).
label {
    monitor =
    text = cmd[update:900000] hypr-weather
    font_family = $font
    font_size = 14
    color = $lock_fg_dim
    halign = left
    valign = top
    position = 56, -118
}

# ---- bottom: now playing (MPRIS via playerctl) ---------------------
# Prints nothing when nothing is playing, so the label just disappears.
label {
    monitor =
    text = cmd[update:2000] playerctl -f "{{ status }}  ·  {{ title }} — {{ artist }}" metadata 2>/dev/null | sed 's/^Playing/▶/; s/^Paused/⏸/' || true
    font_family = $font
    font_size = 13
    color = $lock_fg_dim
    halign = center
    valign = bottom
    position = 0, 56
}
