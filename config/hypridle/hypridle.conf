# hypridle.conf — the desktop's idle -> dim -> lock -> DPMS -> suspend ladder.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/ (current syntax, checked
# during this project's stage-20 research)
#
# Single owner of every idle timer here — see docs/POWER.md for the full
# ownership matrix. systemd-logind's own IdleAction is pinned to "ignore" by
# `install.sh power` precisely so it never races these listeners.
#
# The ladder (the only four numbers that matter — change these to retune
# everything; nothing else in this repo duplicates a timeout):
#     150s  ( 2.5 min)  dim the screen (not to 0 — restored verbatim on resume)
#     300s  (   5 min)  lock
#     330s  ( 5.5 min)  DPMS off (all monitors — no eDP-1 / cardN assumption)
#    1800s  (  30 min)  suspend
# Priorities battery over being unobtrusive, without being aggressive about
# it — this is the same cadence Hyprland's own hypridle documentation ships
# as its reference example.
#
# Every path that can trigger a real suspend — this file's own 1800s
# listener, closing the lid (logind, config/logind/), or a manual
# `systemctl suspend` — funnels through the SAME before_sleep_cmd below, so
# the screen is locked exactly once before sleep, whichever of those
# triggered it. There is no separate lid script and no second lock call.
#
# hyprlock is only ever started from lock_cmd below — it is not autostarted
# and does not stay running once unlocked (config/hypr/lua/autostart.lua only
# starts hypridle, never hyprlock).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 2   # auto: block the actual suspend until hyprlock reports itself locked
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
